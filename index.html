<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <link rel="icon" href="assets/identidade/logo-amboni.svg" type="image/svg+xml">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Floricultura Amboni · Aqui, todo afeto floresce</title>
  <meta name="description" content="Floricultura Amboni: flores e presentes para quem você quer lembrar com carinho.">
  <meta name="theme-color" content="#FBF6EC">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800&family=Playfair+Display:ital,wght@0,600;1,600&display=swap" rel="stylesheet">
  <script src="js/cedo.js"></script>
  <link rel="stylesheet" href="css/estilo.css?v=15">
  <script type="module" src="js/app-preview.js?v=1"></script>
</head>
<body data-pagina="inicio">
  <a class="pular" href="#conteudo">Pular para o conteúdo</a>

  <div id="topo-site"></div>

  <main id="conteudo" tabindex="-1">
    <section class="abertura" aria-labelledby="titulo-abertura">
      <img class="abertura-foto" src="assets/amboni-jardim-conceito.webp" alt="" aria-hidden="true">
      <div class="container abertura-grade">
        <div class="abertura-conteudo">
          <h1 class="titulo-hero" id="titulo-abertura">
            <span class="palavra">Aqui,</span>
            <span class="palavra">Todo</span>
            <span class="palavra">Afeto</span>
            <span class="palavra"><em>Floresce</em></span>
          </h1>
          <p class="hero-texto">Flores e presentes para quem você quer lembrar com carinho.</p>
          <div class="ctas">
            <a class="botao magnetico" href="#fileiras">Explorar categorias →</a>
            <a class="botao botao-claro magnetico" href="#destaque">Ver destaques</a>
          </div>
        </div>
        <div class="assinatura-abertura" aria-label="Fazendeiro da Floricultura Amboni">
          <i class="identidade identidade-fazendeiro" aria-hidden="true"></i>
          <p>Florescendo histórias<br>com carinho, beleza e afeto.</p>
        </div>
      </div>
    </section>

    <section class="destaque" id="destaque" aria-roledescription="carrossel" aria-label="Destaques por categoria">
      <div class="destaque-trilho" id="destaque-trilho"></div>
      <div class="destaque-pontos" id="destaque-pontos"></div>
    </section>

    <section class="secao" aria-label="Categorias">
      <div class="container fileiras-intro">
        <i class="identidade identidade-flor" aria-hidden="true"></i>
        <h2>Nossos produtos</h2>
        <p>Imagens ilustrativas. A Amboni ainda vai confirmar produtos, fotos e valores.</p>
        <form class="nuvem-busca busca-inicio" action="busca.html" method="get" role="search">
          <label class="sr-only" for="busca-inicio-q">Buscar produtos</label>
          <input id="busca-inicio-q" name="q" type="search" placeholder="Nome, cor ou tamanho" autocomplete="off" enterkeyhint="search" maxlength="80">
          <button class="botao" type="submit">Buscar</button>
        </form>
      </div>
      <div class="container" id="fileiras"></div>
    </section>
  </main>

  <div id="rodape-site"></div>


</body>
</html>
