<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <link rel="icon" href="assets/identidade/logo-amboni.svg" type="image/svg+xml">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Categoria · Floricultura Amboni</title>
  <meta name="theme-color" content="#FBF6EC">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800&family=Playfair+Display:ital,wght@0,600;1,600&display=swap" rel="stylesheet">
  <script src="js/cedo.js"></script>
  <link rel="stylesheet" href="css/estilo.css?v=15">
  <script type="module" src="js/app-preview.js?v=1"></script>
</head>
<body data-pagina="categoria">
  <a class="pular" href="#conteudo">Pular para o conteúdo</a>

  <div id="topo-site"></div>

  <main id="conteudo" tabindex="-1">
    <section class="cabecalho-categoria" id="cabecalho-categoria">
      <div class="container">
        <nav class="migalhas" aria-label="Você está em">
          <a href="index.html#fileiras">Categorias</a> / <span id="migalha-categoria" aria-current="page"></span>
        </nav>
        <h1 id="titulo-categoria" tabindex="-1"></h1>
        <p id="frase-categoria"></p>
      </div>
    </section>

    <section class="pagina-categoria" id="conteudo-categoria">
      <div class="container">
        <p class="aviso">Imagens e produtos demonstrativos. Fotos oficiais, catálogo e valores serão confirmados pela Amboni.</p>
        <div id="filtros"></div>
        <ul class="grade-cartoes" id="lista-produtos" aria-label="Produtos desta categoria"></ul>
        <div id="busca-vazia" hidden></div>
        <p class="vazio" id="categoria-vazia" hidden>Nenhum produto cadastrado nesta categoria ainda.</p>
      </div>
    </section>

    <section class="pagina-categoria" id="categoria-nao-encontrada" hidden>
      <div class="container">
        <p>Esta categoria não existe ou mudou de nome.</p>
        <a class="botao magnetico" href="index.html#fileiras">Ver todas as categorias</a>
      </div>
    </section>
  </main>

  <div id="rodape-site"></div>


</body>
</html>
